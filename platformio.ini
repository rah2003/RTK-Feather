; PlatformIO project for the RTK-Feather interim build.
;
; Four environments, two boards x two purposes, mirroring the Metro project's own
; bringup/rtkbridge split (rah2003/SWMaps-propertylines firmware/platformio.ini):
;
;   pio run -e huzzah32-bringup      -> Phase 1 bench sketch (LED/I2C/buttons/NVS + fake NMEA)
;   pio run -e huzzah32-rover        -> Phase 2 Rover firmware (NTRIP -> RTCM3 -> F9P UART1)
;   pio run -e adalogger_m0-bringup  -> Phase 1 bench sketch (SD/status-link + USB-replay UBX harness)
;   pio run -e adalogger_m0-rover    -> Phase 2 Rover firmware (passive UART1 tap -> .ubx on SD)
;
; `src_dir` points at `firmware/`; each environment's `build_src_filter` selects a purpose
; subfolder (bringup/ or rover/) plus that board's shared top-level files, plus `common/`
; (portable code used by more than one target -- ringbuf.h, the status-link protocol,
; ubx_extractor). `common/` must stay free of ESP32-only (WiFi.h, Preferences.h,
; SparkFun_u-blox_GNSS_v3.h) or SAMD-only (wiring_private.h, sercom) includes, since it is
; compiled into all four environments.
;
; Board IDs verified against the current platformio/platform-* board defs (2026-07-11):
; https://github.com/platformio/platform-espressif32/blob/develop/boards/featheresp32.json
; https://github.com/platformio/platform-atmelsam/blob/master/boards/adafruit_feather_m0.json
; SparkFun u-blox GNSS v3 version pinned to match Metro's proven-stable combination
; (rah2003/SWMaps-propertylines firmware/platformio.ini, firmware/README.md).

[platformio]
src_dir = firmware
default_envs = huzzah32-rover, adalogger_m0-rover

[env:huzzah32-bringup]
platform = espressif32 @ 6.7.0
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter = +<huzzah32/bringup/> -<huzzah32/rover/> -<adalogger_m0/> -<common/>
build_flags =
    -DFAKE_NMEA_SOURCE=1   ; Phase 1 default: no F9P on the bench yet (test-plan.md Stage 1)

[env:huzzah32-rover]
platform = espressif32 @ 6.7.0
board = featheresp32
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<huzzah32/rover/>
    +<common/ringbuf.h>
    +<common/status_link.h> +<common/status_link.cpp>
    -<huzzah32/bringup/> -<adalogger_m0/>
build_flags =
    ; --- compile-time feature flags (see huzzah32/rover/features.h) ---
    -DFEATURE_NTRIP=1
    -DFEATURE_BLE=0        ; v1 is WiFi-only; flip to 1 + add h2zero/NimBLE-Arduino for Phase 4
    -DFEATURE_BASE=0       ; Rover-only for v1 (docs/QUESTIONS.md: Base deferred until Phase 3)
lib_deps =
    sparkfun/SparkFun u-blox GNSS v3 @ ^3.1.8

[env:adalogger_m0-bringup]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<adalogger_m0/*.cpp> +<adalogger_m0/*.h>
    +<adalogger_m0/bringup/>
    +<common/ubx_extractor.h> +<common/ubx_extractor.cpp>
    -<adalogger_m0/rover/> -<huzzah32/> -<common/status_link.*> -<common/ringbuf.h>
build_flags =
    ; FAT16/FAT32 only -- compiles out SdFat's exFAT support (project mandates FAT32 cards,
    ; docs/hardware/checklists.md; both sketches use SdFat32/File32 explicitly). Saves RAM on
    ; a 32 KiB part. SdFatConfig.h documents this as a PlatformIO-settable option.
    -DSDFAT_FILE_TYPE=1
lib_deps =
    greiman/SdFat @ ^2.3.1

[env:adalogger_m0-rover]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<adalogger_m0/*.cpp> +<adalogger_m0/*.h>
    +<adalogger_m0/rover/>
    +<common/ubx_extractor.h> +<common/ubx_extractor.cpp>
    +<common/status_link.h> +<common/status_link.cpp>
    -<adalogger_m0/bringup/> -<huzzah32/> -<common/ringbuf.h>
build_flags =
    -DSDFAT_FILE_TYPE=1    ; FAT-only, same rationale as adalogger_m0-bringup
    ; SERCOM UART RX buffers 350 B -> 1024 B (verified #ifndef-guarded in the Adafruit core's
    ; RingBuffer.h, so a -D wins). During an SD write stall this buffer is the ONLY thing
    ; absorbing the 11,520 B/s tap stream -- the 350 B default is ~30 ms, one bad write stall
    ; would drop ~kBs of RAWX mid-frame. 1024 B rides out ~89 ms, which covers typical
    ; write-latency spikes on the pre-allocated contiguous files the rover uses (main.cpp);
    ; the Stage 2 slow-card bench test (test-plan.md) is the arbiter for the tail.
    ; Why not bigger: the define is global -- each Uart object carries BOTH an RX and a TX
    ; ring at this size (verified in the core's Uart.h), x3 instances (Serial1, Serial2,
    ; core-hidden Serial5) = 6 buffers per byte of this setting. 2048 measured at 98% RAM;
    ; 1024 lands at ~80% with the UBX ring shrunk 16 -> 12 KiB (common/ubx_extractor.h).
    ; Rover env only: bringup replays over native-USB CDC (unaffected by this define).
    -DSERIAL_BUFFER_SIZE=1024
lib_deps =
    greiman/SdFat @ ^2.3.1
